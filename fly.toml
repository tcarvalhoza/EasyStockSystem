app = 'easystock-system'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_URL = 'https://easystock-api.fly.dev'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
